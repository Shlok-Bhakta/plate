[package]
name = "personal-food"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "food"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "limits"] }
libc = "0.2"
sha2 = "0.10"
serde_json = "1"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = true
