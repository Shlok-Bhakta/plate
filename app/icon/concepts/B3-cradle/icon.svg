<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Plate B3 "Cradle": a bowl in section (two concentric arcs) holding a single tangerine dot, the day's calories. -->
  <defs>
    <linearGradient id="bg" x1="0.25" y1="0" x2="0.65" y2="1"><stop offset="0" stop-color="#1592A8"/><stop offset="0.55" stop-color="#0B6378"/><stop offset="1" stop-color="#06374A"/></linearGradient>
    <radialGradient id="bgl" cx="0.3" cy="0.15" r="0.75"><stop offset="0" stop-color="#5ADCEC" stop-opacity="0.32"/><stop offset="1" stop-color="#5ADCEC" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb" gradientUnits="userSpaceOnUse" cx="452" cy="374" r="241"><stop offset="0" stop-color="#FFB47C"/><stop offset="0.42" stop-color="#F8732A"/><stop offset="1" stop-color="#C4400A"/></radialGradient>
    <radialGradient id="spec" gradientUnits="userSpaceOnUse" cx="450" cy="366" r="78"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="bowl" gradientUnits="userSpaceOnUse" x1="212" y1="414" x2="732" y2="714"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.65" stop-color="#F1F6F7"/><stop offset="1" stop-color="#C9DADF"/></linearGradient>
    <filter id="sh" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="glass" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="4" dy="6" result="o1"/>
      <feComposite in="SourceAlpha" in2="o1" operator="out" result="e1"/>
      <feGaussianBlur in="e1" stdDeviation="2" result="b1"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.9"/>
      <feComposite in2="b1" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" result="hl"/>
      <feOffset in="SourceAlpha" dx="-6" dy="-8" result="o2"/>
      <feComposite in="SourceAlpha" in2="o2" operator="out" result="e2"/>
      <feGaussianBlur in="e2" stdDeviation="5" result="b2"/>
      <feFlood flood-color="#0A3442" flood-opacity="0.22"/>
      <feComposite in2="b2" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in" result="sd"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="sd"/><feMergeNode in="hl"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#bgl)"/>
  <circle cx="518" cy="468" r="142" fill="#021820" opacity="0.45" filter="url(#sh)"/>
  <path d="M212 414 H316 A196 196 0 0 0 708 414 H812 A300 300 0 0 1 212 414 Z" fill="#021820" opacity="0.5" filter="url(#sh)" transform="translate(6 26)"/>
  <circle cx="512" cy="444" r="142" fill="url(#orb)" filter="url(#glass)"/>
  <circle cx="512" cy="444" r="142" fill="url(#spec)"/>
  <path d="M212 414 H316 A196 196 0 0 0 708 414 H812 A300 300 0 0 1 212 414 Z" fill="url(#bowl)" filter="url(#glass)"/>
</svg>